services:
  llamacpp:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda13
    command: >
      --config /app/config/llama-swap.yaml
      --listen 0.0.0.0:8081
    ports:
      - "8081:8080"
    cap_add: 
      - IPC_LOCK  
    volumes:
      - .config.llamaswap:/app/config:ro
      - ~/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
  pi:
    image: alpine:latest
    command: >
      sh -c "apk upgrade && apk add --no-cache libstdc++ libgcc ast-grep ripgrep fd fzf jq python3 py3-pip uv rust cargo go nodejs npm git delve lldb sqlite bash curl imagemagick &&
        #      apk add --no-cache poppler poppler-utils zip unzip pandoc libreoffice qpdf tesseract-ocr tesseract-ocr-data-fra tesseract-ocr-data-eng ghostscript ffmpeg font-dejavu font-noto fontconfig &&
        #      apk add --no-cache gcompat &&
        #      pip install --break-system-packages pypdf pdfplumber reportlab pytesseract pdf2image imageio &&
        #      pip install --break-system-packages openpyxl pandas markitdown python-pptx defusedxml lxml Pillow numpy &&
        #      npm install -g docx pptxgenjs sharp react react-dom react-icons playwright &&
        #      echo export NODE_PATH=/usr/local/lib/node_modules >> ~/.profile &&
        #      echo export PATH=$PATH:"/root/.pi/agent/skills/xlsx/scripts/office/" >> ~/.profile &&
        #      playwright install chromium &&
              npm install -g --ignore-scripts @earendil-works/pi-coding-agent &&
              sleep infinity"
    working_dir: /root/output
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
      - "/sys/devices/virtual/powercap:/sys/devices/virtual/powercap:ro"
      - .config.pi:/root/.pi
      - /home/vrh/Documents/projects/lang/opencode-output:/root/output
    environment:
      - COLORTERM=truecolor
      - TERM=xterm-256color
      - PI_TRUE_COLOR=0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/$(id -u)
    depends_on:
      - llamacpp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
